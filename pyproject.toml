[project]
name = "igft"
version = "0.1.0"
description = "Local, low-volume Instagram follower tracker for research, backed by PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "instaloader>=4.15.3",
    "platformdirs>=4.12.2",
    "psycopg[binary]>=3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0,<2.1",
    "typer>=0.27.2",
]

[project.scripts]
igft = "igft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/igft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "db: needs a throwaway PostgreSQL database named by IGFT_TEST_DATABASE_URL",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
]
